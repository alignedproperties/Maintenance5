<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Photos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #F2EEE3;
    --surface: #FFFFFF;
    --surface-2: #EAE4D3;
    --ink: #1E1B16;
    --muted: #746C5C;
    --border: #D9D1BC;
    --yellow: #E8B400;
    --yellow-ink: #2B2100;
    --blue: #2E5C82;
    --blue-ink: #FFFFFF;
    --red: #B23A2E;
    --red-ink: #FFFFFF;
    --stripe-dark: #17140F;
    --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1B16; --surface: #2A251D; --surface-2: #332C22;
      --ink: #F2EEE3; --muted: #B7AD98; --border: #453D30;
      --yellow: #F0C33A; --yellow-ink: #241C00;
      --blue: #6FA3CC; --blue-ink: #0C1E2B;
      --red: #E2695C; --red-ink: #2B0D08;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1B16; --surface: #2A251D; --surface-2: #332C22;
    --ink: #F2EEE3; --muted: #B7AD98; --border: #453D30;
    --yellow: #F0C33A; --yellow-ink: #241C00;
    --blue: #6FA3CC; --blue-ink: #0C1E2B;
    --red: #E2695C; --red-ink: #2B0D08;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .hazard {
    height: 7px;
    background: repeating-linear-gradient(
      135deg,
      var(--yellow), var(--yellow) 11px,
      var(--stripe-dark) 11px, var(--stripe-dark) 22px
    );
    flex-shrink: 0;
  }

  header {
    padding: 18px 18px 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 34px;
    line-height: 1;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .ticket-date {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    padding-bottom: 2px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 0 18px 18px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    color: var(--muted);
  }
  .field input[type="text"] {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--border);
    padding: 6px 2px;
    outline: none;
  }
  .field input[type="text"]:focus {
    border-bottom-color: var(--blue);
  }

  .mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .mode-row .mode-label { font-size: 12px; color: var(--muted); }
  .segmented {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .segmented button {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }

  .capture-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 22px 0 6px;
  }
  .shutter {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: 4px solid var(--ink);
    background: var(--yellow);
    color: var(--yellow-ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .shutter:active { transform: scale(0.97); }
  .shutter svg { width: 34px; height: 34px; }

  .library-link {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: var(--blue);
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 6px 8px;
  }
  .library-link svg { width: 17px; height: 17px; }

  .filmstrip-wrap { min-height: 96px; }
  .filmstrip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scroll-snap-type: x proximity;
  }
  .thumb {
    position: relative;
    flex: 0 0 auto;
    width: 84px;
    height: 84px;
    border-radius: 3px;
    overflow: hidden;
    border: 1.5px solid var(--border);
    scroll-snap-align: start;
    background: var(--surface-2);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb button {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(20,16,10,0.72);
    color: #fff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty-state {
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13.5px;
    border: 1.5px dashed var(--border);
    border-radius: 4px;
  }

  footer {
    position: sticky;
    bottom: 0;
    background: var(--surface);
    border-top: 1.5px solid var(--border);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .count-block {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }
  .count-block .count { font-weight: 700; font-size: 15px; }
  .count-block .size { font-size: 12px; color: var(--muted); }

  .save-btn {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14.5px;
    color: var(--blue-ink);
    background: var(--blue);
    border: none;
    border-radius: 4px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .save-btn svg { width: 17px; height: 17px; }
  .save-btn:disabled {
    background: var(--surface-2);
    color: var(--muted);
    cursor: not-allowed;
  }
  .save-note {
    font-size: 12px;
    color: var(--muted);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--bg);
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }

  input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="hazard" aria-hidden="true"></div>

<header>
  <h1>Job Photos</h1>
  <div class="ticket-date" id="ticketDate"></div>
</header>

<main>
  <div class="field">
    <label for="jobLabel">Job or address</label>
    <input type="text" id="jobLabel" placeholder="e.g. 142 Oak St – Unit 2" autocomplete="off">
  </div>

  <div class="mode-row">
    <span class="mode-label">New photos</span>
    <div class="segmented" role="group" aria-label="Photo quality">
      <button type="button" data-mode="standard" aria-pressed="true">Standard</button>
      <button type="button" data-mode="high" aria-pressed="false">High</button>
    </div>
  </div>

  <div class="capture-block">
    <button class="shutter" id="takePhotoBtn" aria-label="Take photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
        <circle cx="12" cy="14" r="3.5"/>
      </svg>
      TAKE PHOTO
    </button>
    <button class="library-link" id="addLibraryBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="14" height="14" rx="1.5"/>
        <path d="M7 20h11a2 2 0 0 0 2-2V7"/>
        <circle cx="7.5" cy="8.5" r="1.5"/>
        <path d="M4 15l3.5-3.5a1.5 1.5 0 0 1 2 0L13 15"/>
      </svg>
      Add from library
    </button>
  </div>

  <div class="filmstrip-wrap">
    <div class="empty-state" id="emptyState">No photos yet — tap Take Photo to start.</div>
    <div class="filmstrip" id="filmstrip" aria-live="polite"></div>
  </div>
</main>

<footer>
  <div class="count-block">
    <span class="count" id="countText">0 photos</span>
    <span class="size" id="sizeText"></span>
  </div>
  <button class="save-btn" id="saveBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"/>
      <path d="M7 10l5 5 5-5"/>
      <path d="M4 19h16"/>
    </svg>
    <span id="saveBtnLabel">Save ZIP</span>
  </button>
</footer>

<div class="toast" id="toast" role="status"></div>

<input type="file" id="cameraInput" accept="image/*" capture="environment">
<input type="file" id="libraryInput" accept="image/*" multiple>

<script>
(function () {
  'use strict';

  var MODES = {
    standard: { maxDim: 1600, quality: 0.72 },
    high: { maxDim: 2400, quality: 0.9 }
  };
  var currentMode = 'standard';
  var photos = []; // { id, blob, thumbUrl, sizeBytes }

  var jobLabel = document.getElementById('jobLabel');
  var filmstrip = document.getElementById('filmstrip');
  var emptyState = document.getElementById('emptyState');
  var countText = document.getElementById('countText');
  var sizeText = document.getElementById('sizeText');
  var saveBtn = document.getElementById('saveBtn');
  var saveBtnLabel = document.getElementById('saveBtnLabel');
  var toast = document.getElementById('toast');
  var cameraInput = document.getElementById('cameraInput');
  var libraryInput = document.getElementById('libraryInput');
  var ticketDate = document.getElementById('ticketDate');

  ticketDate.textContent = new Date().toLocaleDateString(undefined, {
    month: 'short', day: 'numeric', year: 'numeric'
  });

  try {
    var savedLabel = localStorage.getItem('jobPhotosLastLabel');
    if (savedLabel) jobLabel.value = savedLabel;
  } catch (e) { /* storage unavailable, ignore */ }
  jobLabel.addEventListener('input', function () {
    try { localStorage.setItem('jobPhotosLastLabel', jobLabel.value); } catch (e) {}
  });

  document.querySelectorAll('.segmented button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.segmented button').forEach(function (b) {
        b.setAttribute('aria-pressed', 'false');
      });
      btn.setAttribute('aria-pressed', 'true');
      currentMode = btn.getAttribute('data-mode');
    });
  });

  document.getElementById('takePhotoBtn').addEventListener('click', function () {
    cameraInput.value = '';
    cameraInput.click();
  });
  document.getElementById('addLibraryBtn').addEventListener('click', function () {
    libraryInput.value = '';
    libraryInput.click();
  });
  cameraInput.addEventListener('change', function (e) {
    handleFiles(e.target.files);
  });
  libraryInput.addEventListener('change', function (e) {
    handleFiles(e.target.files);
  });

  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    files.forEach(function (file) {
      if (file && file.type && file.type.indexOf('image/') === 0) {
        processFile(file);
      }
    });
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { resolve({ img: img, url: url }); };
      img.onerror = function (err) { URL.revokeObjectURL(url); reject(err); };
      img.src = url;
    });
  }

  function processFile(file) {
    var mode = MODES[currentMode];
    loadImage(file).then(function (result) {
      var img = result.img;
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, mode.maxDim / Math.max(w, h));
      var outW = Math.max(1, Math.round(w * scale));
      var outH = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, outW, outH);
      URL.revokeObjectURL(result.url);
      canvas.toBlob(function (blob) {
        if (!blob) { showToast('Could not process that photo.'); return; }
        var id = 'p' + Date.now() + Math.random().toString(16).slice(2);
        var thumbUrl = URL.createObjectURL(blob);
        photos.push({ id: id, blob: blob, thumbUrl: thumbUrl, sizeBytes: blob.size });
        renderFilmstrip();
        updateFooter();
      }, 'image/jpeg', mode.quality);
    }).catch(function () {
      showToast('Could not read that photo.');
    });
  }

  function removePhoto(id) {
    var idx = photos.findIndex(function (p) { return p.id === id; });
    if (idx === -1) return;
    URL.revokeObjectURL(photos[idx].thumbUrl);
    photos.splice(idx, 1);
    renderFilmstrip();
    updateFooter();
  }

  function renderFilmstrip() {
    filmstrip.innerHTML = '';
    photos.forEach(function (p, idx) {
      var item = document.createElement('div');
      item.className = 'thumb';
      var img = document.createElement('img');
      img.src = p.thumbUrl;
      img.alt = 'Photo ' + (idx + 1);
      var del = document.createElement('button');
      del.setAttribute('aria-label', 'Remove photo ' + (idx + 1));
      del.textContent = '\u00D7';
      del.addEventListener('click', function () { removePhoto(p.id); });
      item.appendChild(img);
      item.appendChild(del);
      filmstrip.appendChild(item);
    });
    emptyState.style.display = photos.length ? 'none' : 'flex';
  }

  function formatSize(bytes) {
    if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function updateFooter() {
    countText.textContent = photos.length === 1 ? '1 photo' : (photos.length + ' photos');
    if (photos.length) {
      var total = photos.reduce(function (sum, p) { return sum + p.sizeBytes; }, 0);
      sizeText.textContent = '~' + formatSize(total) + ' total';
    } else {
      sizeText.textContent = '';
    }
    saveBtn.disabled = photos.length === 0;
  }

  window.addEventListener('beforeunload', function (e) {
    if (photos.length > 0) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      toast.classList.remove('show');
    }, 2600);
  }

  function slugify(str) {
    return (str || '')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateStamp() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  function triggerDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  saveBtn.addEventListener('click', function () {
    if (photos.length === 0) return;
    saveBtn.disabled = true;
    saveBtnLabel.textContent = 'Zipping\u2026';
    var zip = new JSZip();
    photos.forEach(function (p, idx) {
      zip.file('photo-' + pad(idx + 1) + '.jpg', p.blob);
    });
    zip.generateAsync({ type: 'blob' }).then(function (content) {
      var base = slugify(jobLabel.value) || 'job-photos';
      var filename = base + '-' + dateStamp() + '.zip';
      triggerDownload(content, filename);
      showToast('Saved to your Downloads.');
    }).catch(function () {
      showToast('Could not build the zip. Try again.');
    }).finally(function () {
      saveBtnLabel.textContent = 'Save ZIP';
      updateFooter();
    });
  });

  renderFilmstrip();
  updateFooter();
})();
</script>

</body>
</html>
